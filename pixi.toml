[workspace]
name = "conda-code"
description = "Conda environments, workspaces, and package management for Visual Studio Code"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[feature.docs.dependencies]
python = "3.13.*"
sphinx = ">=7.0"
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx-design = ">=0.6"
sphinx-copybutton = ">=0.5"
sphinx-sitemap = ">=2.5"

[feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -b dirhtml docs docs/_build/dirhtml", description = "Build documentation" }
docs-serve = { cmd = "python -m http.server", cwd = "docs/_build/dirhtml", description = "Serve built documentation" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
